<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <title>Clima atual</title>
</head>

<body class="min-vh-100 d-flex flex-column">
    <div class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">Clima atual ☀️</h1>
            <p class="text-muted">Descubra o clima em qualquer cidade do mundo</p>
        </div>
        
        <div class="w-100" style="max-width: 500px;">
            <form class="mb-4">
                <div class="mb-3">
                    <label for="city" class="form-label fw-semibold">Insira o nome de uma cidade:</label>
                    <div class="input-group">
                        <input id="city" type="text" class="form-control form-control-lg" placeholder="Ex: São Paulo" autofocus>
                        <button type="submit" class="btn btn-primary btn-lg">Buscar</button>
                    </div>
                </div>
            </form>
            
            <div class="card city-data d-none shadow-sm">
                <div class="card-body text-center py-4">
                    <h2 class="card-title h3 mb-3" data-js="city-name">Nome da cidade</h2>
                    <!-- TODO: include weather icon
                    <div class="city-weather-icon mb-3">
                        <img data-js="city-weather-icon" src="./images/1.png"
                            alt="Condições climáticas da cidade" class="img-fluid" style="max-height: 100px;">
                    </div> -->                    
                    <p class="card-text text-muted mb-2" data-js="city-weather">Clima</p>
                    <h3 class="display-5 fw-bold text-primary mb-0" data-js="city-temperature">00 °C</h3>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light py-3 mt-auto">
        <div class="container">
            <div class="row d-flex justify-content-center">
                <p class="text-center">
                        <a href="https://github.com/zignini" target="blank" rel="noopener noreferrer"><img class="footer-icon" src="/images/github.svg" alt="GitHub de Jacqueline Pruschinski"></a>
                </p>
                <p class="text-center">
                        <a href="https://www.linkedin.com/in/jacqueline-pruschinski/" target="blank" rel="noopener noreferrer"><img class="footer-icon" src="/images/linkedin.svg" alt="LinkedIn de Jacqueline Pruschinski"></a>
                </p>
        </div>
        </div>
        <div class="container text-center">
            <p class="mb-0 text-muted">
                <small>
                    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-muted">
                        <img class="footer-icon" src="/images/cc.svg" alt="Creative Commons icon">
                    </a> 
                    4.0 By <a href="#" class="text-decoration-none text-muted">Jacqueline Pruschinski</a>
                </small>
            </p>
        </div>
    </footer>
    
    <script src="./src/weather.js"></script>
    <script src="./src/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
